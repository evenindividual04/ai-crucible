name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-checks:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -r backend/requirements.txt

      - name: Secret smoke scan
        run: |
          if git grep -nE 'sk-[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH) PRIVATE KEY' -- src backend frontend tests; then
            echo "Potential secrets detected in tracked source files"
            exit 1
          fi

      - name: Run verification script
        run: |
          chmod +x scripts/verify.sh
          VERIFY_SKIP_FRONTEND_BUILD=1 ./scripts/verify.sh

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
